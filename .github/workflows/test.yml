name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node and pnpm, at the versions from mise.toml
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # uvx runs cram
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint --deny-warnings

      - name: Check formatting
        run: pnpm exec oxfmt --check

      # The chromium build for the playwright version in pnpm-lock.yaml,
      # plus the system libraries it needs
      - name: Install playwright chromium
        timeout-minutes: 10
        run: ./install-playwright-browser --with-deps

      - name: Run tests
        run: pnpm test
